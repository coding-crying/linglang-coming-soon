<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingLang</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms beacons: static declarations so the build scanner registers each form name -->
    <form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="email" name="email" />
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="request-access" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="request-access" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="interest"></select>
      <textarea name="notes"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
