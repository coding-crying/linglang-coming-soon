<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Access | LingLang</title>
    <style>
      :root {
        --bg: #07080a;
        --panel: #0f1218;
        --text: #f8fafc;
        --muted: #95a0b5;
        --accent: #6366f1;
        --line: rgba(255, 255, 255, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 85% 5%, rgba(99, 102, 241, 0.2), transparent 30%), var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        min-height: 100vh;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
      .card {
        background: color-mix(in srgb, var(--panel) 88%, black);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px;
      }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; }
      p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
      label { display: block; margin: 14px 0 8px; font-size: 0.95rem; color: #dbe2ee; }
      input, textarea, select {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }
      button {
        margin-top: 16px;
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 13px 18px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      a { color: #b9c3ff; }
      .back { display: inline-block; margin-top: 14px; color: var(--muted); text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Request Access</h1>
        <p>
          Want early access to research notes, private demos, or launch updates? Submit this form and we will reach out.
        </p>

        <form name="request-access" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="request-access" />
          <input type="hidden" name="bot-field" />

          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="interest">What are you interested in?</label>
          <select id="interest" name="interest">
            <option value="research">Research access</option>
            <option value="live-demo">Live demo</option>
            <option value="self-hosted">Self-hosted updates</option>
          </select>

          <label for="notes">Notes (optional)</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Tell us your use case"></textarea>

          <button type="submit">Send Request</button>
        </form>

        <a class="back" href="/">Back to LingLang</a>
      </section>
    </main>
  </body>
</html>
