<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docs Coming Soon | LingLang</title>
    <style>
      :root { --bg:#07080a; --panel:#10131a; --text:#f8fafc; --muted:#9aa4b7; --line:rgba(255,255,255,0.12); --accent:#6366f1; }
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%, rgba(99,102,241,.2), transparent 28%),var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif}
      .card{max-width:680px;margin:24px;padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-align:center}
      h1{margin:0 0 12px;font-size:clamp(1.8rem,4vw,2.5rem)} p{margin:0;color:var(--muted);line-height:1.65}
      a.btn{display:inline-block;margin-top:18px;padding:11px 16px;border-radius:999px;background:var(--accent);color:white;text-decoration:none;font-weight:600}
      a.link{display:block;margin-top:12px;color:#b8c2ff;text-decoration:none}
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Documentation is coming soon</h1>
      <p>We will publish setup and deployment docs when the Docker image is released.</p>
      <a class="btn" href="/request-access.html">Get launch updates</a>
      <a class="link" href="/">Back to LingLang</a>
    </section>
  </body>
</html>
