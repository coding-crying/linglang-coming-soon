<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Notified - LingLang.app</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                LingLang.app
            </a>
            <div class="nav-menu">
                <a href="demo.html" class="nav-link">Demo</a>
                <a href="self-hosted.html" class="nav-link">Self-Hosted</a>
                <a href="signup.html" class="btn btn-primary" style="padding: 0.6rem 1.2rem; font-size: 0.8rem;">Get Notified</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1 class="text-large">LingLang is Coming Soon.</h1>
            <p style="color: var(--text-secondary); margin-top: 1rem;">
                We're refining the audio engine. Enter your email to get notified when we launch.
            </p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="emailInput" class="form-input" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 1rem;">
                Notify Me
            </button>
            
            <p class="text-mono" style="font-size: 0.75rem; color: var(--text-tertiary); text-align: center; margin-top: 2rem;">
                No spam. Unsubscribe anytime.
            </p>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const btn = this.querySelector('button');
            const originalText = btn.innerText;
            
            btn.innerText = "Processing...";
            btn.style.opacity = "0.7";
            btn.disabled = true;
            
            try {
                const response = await fetch('/submit-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                    btn.innerText = "You're on the list!";
                    btn.style.background = "var(--success-color)"; 
                    btn.style.borderColor = "var(--success-color)";
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                console.error('Signup failed:', error);
                btn.innerText = "Error. Try again.";
                btn.style.background = "var(--warning-color)";
                btn.disabled = false;
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "";
                    btn.style.borderColor = "";
                }, 2000);
            }
        });
    </script>

</body>
</html>
